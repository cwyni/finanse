<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Prywatny licznik zarobków i wydatków w USD.">
<meta name="theme-color" content="#ffffff">
<title>Finanse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: single centered column, ~760px. Tabs → hero number → quiet stats → chart → add row → breakdown → history. No cards, only whitespace and hairlines. */
:root{
  --bg:#ffffff;
  --ink:#0b0b0c;
  --muted:#8a8a8f;
  --soft:#f4f4f5;
  --line:#ececee;
  --accent:#16a36a;
  --neg:#d4483b;
  --sans:"Geist",ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);letter-spacing:-.005em}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px;display:grid;gap:64px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-size:13px;color:var(--muted)}
h2{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 20px}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.tabs button{background:transparent;color:var(--muted);padding:7px 16px;border-radius:8px;font-size:14px}
.tabs button:hover{opacity:1;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line)}
.goal{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.goal input{width:96px;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0;background:transparent;font:500 14px var(--mono);color:var(--ink);text-align:right}
.goal input:focus{outline:none;border-bottom-color:var(--ink)}
.warn{font-size:13px;color:var(--neg);margin-top:-48px}

/* hero */
.hero{display:grid;gap:6px}
.big{font:500 clamp(44px,9vw,72px)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.05em;margin:4px 0 6px;overflow-wrap:anywhere}
.big .c{color:var(--muted)}
.delta{font-size:14px;color:var(--muted)}
.delta b{font-weight:500}
.good{color:var(--accent)} .bad{color:var(--neg)}
.progress{margin-top:18px;display:grid;gap:8px;max-width:420px}
.progress .bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .4s ease}
.progress.over .bar i{background:var(--neg)}
.progress .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.stat{min-width:0}
.stat .v{font:500 18px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-top:2px;overflow-wrap:anywhere}

/* chart */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--mono);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.chart .b{fill:#e4e4e7} .chart .b.cur{fill:var(--ink)}
.chart .b:hover{fill:#c9c9cf} .chart .b.cur:hover{fill:#3a3a3e}
.chart .base{stroke:var(--line)}
.chart .goal-l{stroke-dasharray:3 4}

/* form */
form{display:grid;grid-template-columns:1fr minmax(140px,1.15fr) 1.3fr 1.2fr auto;gap:8px}
.field{min-width:0}
input,select{width:100%;min-width:0;font:14px var(--sans);color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:10px;padding:11px 12px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input::placeholder{color:var(--muted)}
input:focus,select:focus{outline:none;background:var(--bg);border-color:var(--ink)}
#f-amount{font-family:var(--mono)}
.note-field{grid-column:1/-2}
button{font:500 14px var(--sans);cursor:pointer;border-radius:10px;border:0;padding:11px 18px;background:var(--ink);color:var(--bg);transition:opacity .15s}
button:hover{opacity:.85}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.link{background:none;color:var(--muted);padding:0;border-radius:0;font-size:13px}
.link:hover{color:var(--ink);opacity:1}

/* section head with a control on the right */
.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sechead h2{margin:0}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px;gap:2px}
.seg button{background:transparent;color:var(--muted);padding:4px 10px;border-radius:6px;font-size:12px}
.seg button:hover{opacity:1;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.sw.line{height:2px;border-radius:1px}

/* composition: one 100% bar + ranked list */
.mix{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin-bottom:24px}
.mix i{display:block;height:100%;min-width:2px;transition:opacity .15s}
.mix.hl i{opacity:.25} .mix.hl i.on{opacity:1}
.mixrows{display:grid}
.mixrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto 44px 56px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.mixrow:last-child{border-bottom:0}
.mixrow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixrow .amt{font:500 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.mixrow .p{font:13px var(--mono);color:var(--muted);text-align:right}
.mixrow .ch{font:12px var(--mono);text-align:right;color:var(--muted)}
.mixrow.on{background:linear-gradient(90deg,var(--soft),transparent)}

/* tooltip */
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--bg);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.08);border-radius:10px;padding:10px 12px;font-size:12px;min-width:160px;opacity:0;transition:opacity .1s}
.tip.show{opacity:1}
.tip .h{font-weight:600;margin-bottom:6px;font-size:13px}
.tip .r{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;color:var(--muted);line-height:1.7}
.tip .r b{font:500 12px var(--mono);color:var(--ink)}
.tip .r b.good{color:var(--accent)} .tip .r b.bad{color:var(--neg)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:rgba(0,0,0,.025)}
.chart .xh{stroke:var(--muted);stroke-width:1}
.chart .lbl-ink{fill:var(--ink)}

/* list */
.listhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.listhead h2{margin:0}
.listhead select{width:auto;background-color:transparent;padding:6px 26px 6px 10px;font-size:13px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:72px minmax(0,1fr) auto 28px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows .d{font:13px var(--mono);color:var(--muted)}
.rows .t{min-width:0}
.rows .s{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .k{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .a{font:500 15px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:right;white-space:nowrap}
.del{background:none;color:var(--muted);padding:4px;font-size:18px;line-height:1;opacity:0}
.rows li:hover .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--neg)}
.confirm{grid-column:2/-1;display:flex;justify-content:flex-end;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.confirm button{padding:6px 12px;font-size:13px}
.confirm .no{background:var(--soft);color:var(--ink)}
.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14px;display:grid;gap:10px;justify-items:center}

footer{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding-top:8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:680px){
  .wrap{padding-top:28px;gap:48px}
  .stats{grid-template-columns:1fr 1fr}
  form{grid-template-columns:1fr 1fr}
  .note-field{grid-column:1/-1}
  form button{grid-column:1/-1}
  .del{opacity:1}
}
@media (max-width:440px){
  .rows li{grid-template-columns:minmax(0,1fr) auto 24px;gap:4px 12px}
  .rows .d{grid-column:1/-1;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div class="tabs" role="tablist" aria-label="Widok">
      <button role="tab" id="tab-zarobki" data-tab="zarobki" type="button">Zarobki</button>
      <button role="tab" id="tab-wydatki" data-tab="wydatki" type="button">Wydatki</button>
    </div>
    <label class="goal" for="goal"><span id="goal-label"></span>
      <input id="goal" type="number" min="0" step="50" inputmode="decimal" placeholder="$ —">
    </label>
  </div>
  <div class="warn" id="warn" hidden>Ta przeglądarka blokuje zapis. Wpisy znikną po zamknięciu karty.</div>

  <section>
    <div class="hero">
      <div class="eyebrow" id="h-label"></div>
      <div class="big" id="h-value"></div>
      <div class="delta" id="h-delta"></div>
      <div class="progress" id="h-goal" hidden>
        <div class="bar"><i id="h-goalbar"></i></div>
        <div class="lbl"><span id="h-goalpct"></span><span id="h-goalleft"></span></div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section>
    <h2>Ostatnie 12 miesięcy</h2>
    <div class="legend" id="chart-legend"></div>
    <div id="chart"></div>
  </section>

  <section>
    <h2 id="form-title"></h2>
    <form id="form" autocomplete="off">
      <div class="field"><input id="f-amount" type="number" step="0.01" min="0.01" inputmode="decimal" required placeholder="$ 0.00" aria-label="Kwota w USD"></div>
      <div class="field"><input id="f-date" type="date" required aria-label="Data"></div>
      <div class="field"><input id="f-source" list="sourcelist" required aria-label="Opis"></div>
      <div class="field"><select id="f-kind" aria-label="Kategoria"></select></div>
      <button type="submit">Dodaj</button>
      <div class="field note-field"><input id="f-note" placeholder="Notatka (opcjonalnie)" aria-label="Notatka"></div>
    </form>
    <datalist id="sourcelist"></datalist>
  </section>

  <section id="mix-sec">
    <div class="sechead">
      <h2 id="mix-title"></h2>
      <div class="seg" id="mix-period" role="group" aria-label="Okres">
        <button type="button" data-p="cur">Ten miesiąc</button>
        <button type="button" data-p="prev">Poprzedni</button>
        <button type="button" data-p="year">Rok</button>
      </div>
    </div>
    <div class="mix" id="mix"></div>
    <div class="mixrows" id="mixrows"></div>
  </section>

  <section id="pace-sec">
    <h2>Tempo wydatków</h2>
    <div class="legend" id="pace-legend"></div>
    <div id="pace"></div>
  </section>

  <section id="io-sec">
    <h2>Przychody i wydatki · 6 miesięcy</h2>
    <div class="legend">
      <span><i class="sw" style="background:var(--ink)"></i>Przychody</span>
      <span><i class="sw" style="background:#cfcfd4"></i>Wydatki</span>
      <span>liczba nad parą = bilans</span>
    </div>
    <div id="io"></div>
  </section>

  <section>
    <div class="listhead">
      <h2>Historia</h2>
      <select id="filter" aria-label="Filtruj miesiąc"></select>
    </div>
    <div id="list"></div>
  </section>

  <footer>
    <button class="link" id="export-csv" type="button">Eksport CSV</button>
    <button class="link" id="export-json" type="button">Kopia zapasowa</button>
    <button class="link" id="import-btn" type="button">Przywróć kopię</button>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>
<div class="tip" id="tip" aria-hidden="true"></div>

<script>
const USD = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const USD0 = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const MONTHS = ['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const MONTHS_FULL = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const MONTHS_GEN = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ym = d => d.slice(0,7);
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const monthLabel = k => { const [y,m]=k.split('-'); return MONTHS_FULL[+m-1]+' '+y; };
const newId = () => 'l'+Date.now()+Math.random().toString(36).slice(2,6);

/* Each tab is the same tracker with different words and a flipped sense of "good". */
const TABS = {
  zarobki: {
    key:'zarobki.usd.v1', moreIsGood:true,
    goalLabel:'Cel miesięczny', formTitle:'Nowy wpływ', descPh:'Źródło',
    kinds:['Wynagrodzenie','Freelance','Premia','Sprzedaż','Inwestycje','Inne'],
    groupBy:'source', groupTitle:'Źródła w ',
    emptyHint:'Dodaj pierwszy wpływ poniżej',
    demo(m,i){ const r=[{date:m+'-10',amount:5200,source:'Etat (przykład)',kind:'Wynagrodzenie'}];
      if(i%2===0) r.push({date:m+'-18',amount:900+i*150,source:'Zlecenia (przykład)',kind:'Freelance'});
      if(i===3) r.push({date:m+'-22',amount:180,source:'eBay (przykład)',kind:'Sprzedaż'}); return r; }
  },
  wydatki: {
    key:'wydatki.usd.v1', moreIsGood:false,
    goalLabel:'Budżet miesięczny', formTitle:'Nowy wydatek', descPh:'Na co / gdzie',
    kinds:['Jedzenie','Mieszkanie','Rachunki','Transport','Zakupy','Rozrywka','Zdrowie','Subskrypcje','Inne'],
    groupBy:'kind', groupTitle:'Kategorie w ',
    emptyHint:'Dodaj pierwszy wydatek poniżej',
    demo(m,i){ return [
      {date:m+'-01',amount:1450,source:'Czynsz (przykład)',kind:'Mieszkanie'},
      {date:m+'-05',amount:120+i*8,source:'Prąd i internet (przykład)',kind:'Rachunki'},
      {date:m+'-08',amount:310+i*25,source:'Supermarket (przykład)',kind:'Jedzenie'},
      {date:m+'-14',amount:65,source:'Paliwo (przykład)',kind:'Transport'},
      {date:m+'-20',amount:16,source:'Netflix (przykład)',kind:'Subskrypcje'},
    ].concat(i%2?[{date:m+'-24',amount:90+i*20,source:'Kino i restauracja (przykład)',kind:'Rozrywka'}]:[]); }
  }
};
/* Categorical colours, fixed order (validated for colour-blind separation). Colour follows the category, never its rank; "Inne" is neutral grey. */
const SERIES = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
const OTHER = '#a1a1aa';
const colorOf = (c,kind) => { const i=c.kinds.indexOf(kind); return (kind==='Inne'||i<0||i>=SERIES.length) ? OTHER : SERIES[i]; };
const state = { zarobki:{entries:[],goal:0}, wydatki:{entries:[],goal:0} };
let mixPeriod = 'cur', mixHover = null;
let tab = 'zarobki', filter = 'all', pendingDelete = null;
const cfg = () => TABS[tab], S = () => state[tab];

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- storage (this browser) ---------- */
function load(){ for(const k in TABS){ try{ const o=JSON.parse(localStorage.getItem(TABS[k].key)||'{}'); state[k]={entries:o.entries||[],goal:o.goal||0}; }catch(e){} } }
function save(k=tab){ try{ localStorage.setItem(TABS[k].key,JSON.stringify(state[k])); }catch(e){} }

/* ---------- derived ---------- */
function sumBy(list,keyFn){ const m=new Map(); for(const e of list){ const k=keyFn(e); m.set(k,(m.get(k)||0)+(+e.amount||0)); } return m; }
function lastMonths(n){ const out=[], d=new Date(); for(let i=n-1;i>=0;i--){ const x=new Date(d.getFullYear(),d.getMonth()-i,1); out.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')); } return out; }
const monthSum = (k,m) => state[k].entries.reduce((a,e)=>a+(ym(e.date)===m?+e.amount||0:0),0);

/* ---------- tabs ---------- */
function setTab(t, quiet){
  if(!TABS[t]) t='zarobki';
  tab=t; filter='all'; pendingDelete=null;
  for(const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', String(b.dataset.tab===t));
  const c=cfg();
  $('goal-label').textContent=c.goalLabel;
  $('goal').value=S().goal||'';
  $('form-title').textContent=c.formTitle;
  $('f-source').placeholder=c.descPh;
  $('f-kind').innerHTML=c.kinds.map(k=>`<option>${k}</option>`).join('');
  document.title = t==='wydatki' ? 'Wydatki · Finanse' : 'Zarobki · Finanse';
  if(!quiet){ try{ history.replaceState(null,'','#'+t); }catch(e){} }
  render();
}
document.querySelector('.tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-tab]'); if(b) setTab(b.dataset.tab); });

function render(){
  const c=cfg(), {entries,goal}=S();
  const byMonth = sumBy(entries,e=>ym(e.date));
  const months = lastMonths(12);
  const cur = months[11], prev = months[10], year = cur.slice(0,4);
  const curSum = byMonth.get(cur)||0, prevSum = byMonth.get(prev)||0;
  const yearEntries = entries.filter(e=>e.date.startsWith(year));
  const yearSum = yearEntries.reduce((a,e)=>a+(+e.amount||0),0);
  const active = months.filter(m=>byMonth.get(m));
  const avg = active.length ? active.reduce((a,m)=>a+byMonth.get(m),0)/active.length : 0;

  // hero
  $('h-label').textContent = (tab==='wydatki'?'Wydane · ':'Zarobione · ')+monthLabel(cur);
  const [whole,cents] = USD.format(curSum).split('.');
  $('h-value').innerHTML = `${esc(whole)}<span class="c">.${cents}</span>`;
  if(prevSum){ const p=(curSum-prevSum)/prevSum*100, good=(p>=0)===c.moreIsGood;
    $('h-delta').innerHTML = `<b class="${good?'good':'bad'}">${p>=0?'+':'−'}${Math.abs(p).toFixed(0)}%</b> względem ${MONTHS_GEN[+prev.slice(5)-1]}`; }
  else $('h-delta').textContent = entries.length ? 'Brak wpisów w poprzednim miesiącu' : c.emptyHint;
  $('h-goal').hidden = !goal;
  if(goal){ const pct=curSum/goal*100;
    $('h-goalbar').style.width = Math.min(100,pct)+'%';
    if(c.moreIsGood){
      $('h-goal').classList.remove('over');
      $('h-goalpct').textContent = Math.round(pct)+'% celu';
      $('h-goalleft').textContent = curSum>=goal ? 'Cel osiągnięty' : 'Brakuje '+USD0.format(goal-curSum);
    } else {
      $('h-goal').classList.toggle('over', curSum>goal);
      $('h-goalpct').textContent = Math.round(pct)+'% budżetu';
      $('h-goalleft').textContent = curSum>goal ? 'Przekroczono o '+USD0.format(curSum-goal) : 'Zostało '+USD0.format(goal-curSum);
    } }

  const net = monthSum('zarobki',cur) - monthSum('wydatki',cur);
  $('stats').innerHTML = `
    <div class="stat"><div class="eyebrow">Bilans miesiąca</div><div class="v ${net>0?'good':net<0?'bad':''}">${net>0?'+':net<0?'−':''}${USD.format(Math.abs(net))}</div></div>
    <div class="stat"><div class="eyebrow">Poprzedni miesiąc</div><div class="v">${USD.format(prevSum)}</div></div>
    <div class="stat"><div class="eyebrow">Rok ${year}</div><div class="v">${USD.format(yearSum)}</div></div>
    <div class="stat"><div class="eyebrow">Średnio / miesiąc</div><div class="v">${USD.format(avg)}</div></div>`;

  renderChart(months, byMonth, cur, goal, c);
  renderMix(c, cur, prev, year);
  renderPace(cur, prev);
  renderIO(months.slice(6));
  renderFilter(byMonth);
  renderList();
  $('sourcelist').innerHTML = [...new Set(entries.map(e=>e.source))].map(s=>`<option value="${esc(s)}">`).join('');
}

function niceMax(v){ if(v<=0) return 1000; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*p>=v) return m*p; return 10*p; }
const short = v => v>=1000 ? '$'+(Math.round(v/100)/10).toString().replace(/\.0$/,'')+'k' : USD0.format(v);

/* ---------- tooltip ---------- */
const tip = $('tip');
function showTip(ev, html){
  tip.innerHTML = html; tip.classList.add('show');
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if(x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if(y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8,x)+'px'; tip.style.top = Math.max(8,y)+'px';
}
const hideTip = () => tip.classList.remove('show');
const tipRow = (color, name, val) => `<div class="r"><i class="sw" style="background:${color}"></i><span>${esc(name)}</span><b>${val}</b></div>`;
// Charts register hover handlers here, keyed by element id; rebuilt on every render.
const hovers = {};
function bindHover(el){
  el.onmousemove = ev => { const h=hovers[el.id]; if(h) h(ev); };
  el.onmouseleave = () => { hideTip(); const h=hovers[el.id+':leave']; if(h) h(); };
}
['chart','pace','io'].forEach(id=>bindHover($(id)));
const svgX = (svg, ev, W) => { const r=svg.getBoundingClientRect(); return (ev.clientX-r.left)/r.width*W; };

/* ---------- 12-month stacked bars ---------- */
function renderChart(months, byMonth, cur, goal, c){
  const {entries}=S();
  const W=720,H=210,T=24,B=26;
  // per month, per category
  const per = months.map(m=>{ const o={}; for(const e of entries) if(ym(e.date)===m) o[e.kind]=(o[e.kind]||0)+(+e.amount||0); return o; });
  const vals = months.map(m=>byMonth.get(m)||0), top=Math.max(...vals);
  const max = niceMax(Math.max(top, goal||0));
  const y = v => T+(H-T-B)*(1-v/max);
  const bw = W/12, w = Math.min(30,bw*.52);
  const gc = c.moreIsGood ? 'var(--accent)' : 'var(--neg)';
  const used = c.kinds.filter(k=>per.some(o=>o[k]));
  $('chart-legend').innerHTML = used.length>1 ? used.map(k=>`<span><i class="sw" style="background:${colorOf(c,k)}"></i>${esc(k)}</span>`).join('') : '';
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sumy z ostatnich 12 miesięcy według kategorii"><defs>`;
  months.forEach((m,i)=>{ const v=vals[i]; if(!v) return; const x=i*bw+bw/2-w/2, h=Math.max(2,y(0)-y(v));
    s+=`<clipPath id="cb${i}"><rect x="${x}" y="${y(0)-h}" width="${w}" height="${h+4}" rx="4"/></clipPath>`; });
  s += `</defs><line class="base" x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>`;
  if(goal) s+=`<line class="goal-l" style="stroke:${gc}" x1="0" x2="${W}" y1="${y(goal)}" y2="${y(goal)}"/><text style="fill:${gc}" x="0" y="${y(goal)-6}">${c.moreIsGood?'cel':'budżet'} ${short(goal)}</text>`;
  months.forEach((m,i)=>{
    const v=vals[i], cx=i*bw+bw/2, x=cx-w/2;
    if(v>0){
      let acc=0; s+=`<g clip-path="url(#cb${i})">`;
      const ks = c.kinds.filter(k=>per[i][k]);
      ks.forEach((k,j)=>{ const a=per[i][k], y1=y(acc+a), y0=y(acc); acc+=a;
        const gap = j<ks.length-1 ? 2 : 0;   // 2px surface gap between stacked segments
        s+=`<rect x="${x}" y="${y1+gap}" width="${w}" height="${Math.max(0,y0-y1-gap)}" fill="${colorOf(c,k)}" opacity="${m===cur?1:.8}"/>`; });
      s+='</g>';
      if(m===cur || v===top) s+=`<text class="lbl-ink" x="${cx}" y="${y(v)-7}" text-anchor="middle">${short(v)}</text>`;
    }
    s+=`<text x="${cx}" y="${H-6}" text-anchor="middle"${m===cur?' class="lbl-ink" font-weight="600"':''}>${MONTHS[+m.slice(5)-1]}</text>`;
    s+=`<rect class="hit" x="${i*bw}" y="0" width="${bw}" height="${H-B+4}" data-i="${i}"/>`;
  });
  $('chart').innerHTML = s+'</svg>';
  hovers.chart = ev => {
    const i = Math.min(11,Math.max(0,Math.floor(svgX($('chart').firstChild,ev,W)/bw)));
    const ks = Object.entries(per[i]).sort((a,b)=>b[1]-a[1]);
    showTip(ev, `<div class="h">${monthLabel(months[i])} · ${USD.format(vals[i])}</div>` +
      (ks.length ? ks.map(([k,a])=>tipRow(colorOf(c,k),k,USD.format(a))).join('') : '<div class="r" style="grid-template-columns:1fr">Brak wpisów</div>'));
  };
}

/* ---------- composition: where the money goes / comes from ---------- */
function renderMix(c, cur, prev, year){
  const {entries}=S();
  const inP = p => p==='cur' ? e=>ym(e.date)===cur : p==='prev' ? e=>ym(e.date)===prev : e=>e.date.startsWith(year);
  const base = mixPeriod==='cur' ? prev : mixPeriod==='prev' ? (()=>{ const d=new Date(+prev.slice(0,4),+prev.slice(5)-2,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })() : null;
  const now = sumBy(entries.filter(inP(mixPeriod)), e=>e.kind);
  const before = base ? sumBy(entries.filter(e=>ym(e.date)===base), e=>e.kind) : null;
  const total = [...now.values()].reduce((a,b)=>a+b,0);
  $('mix-sec').hidden = !entries.length;
  $('mix-title').textContent = tab==='wydatki' ? 'Na co idą pieniądze' : 'Skąd są pieniądze';
  for(const b of $('mix-period').children){ b.setAttribute('aria-pressed', String(b.dataset.p===mixPeriod)); if(b.dataset.p==='year') b.textContent='Rok '+year; }
  const rows = [...now].sort((a,b)=>b[1]-a[1]);
  if(!rows.length){ $('mix').innerHTML=''; $('mix').style.background='var(--soft)'; $('mixrows').innerHTML=`<div class="empty" style="padding:16px 0">Brak wpisów w tym okresie.</div>`; return; }
  $('mix').style.background='';
  $('mix').classList.toggle('hl', !!mixHover && now.has(mixHover));
  $('mix').innerHTML = rows.map(([k,v])=>`<i data-k="${esc(k)}" class="${k===mixHover?'on':''}" style="flex:${v} 0 0;background:${colorOf(c,k)}" title="${esc(k)}: ${USD.format(v)}"></i>`).join('');
  $('mixrows').innerHTML = rows.map(([k,v])=>{
    let ch='';
    if(before){ const b=before.get(k)||0;
      if(!b) ch='<span title="Nowa kategoria w tym okresie">nowe</span>';
      else { const p=(v-b)/b*100, good=(p>=0)===c.moreIsGood; ch = Math.abs(p)<1 ? '0%' : `<span class="${good?'good':'bad'}">${p>0?'+':'−'}${Math.abs(p).toFixed(0)}%</span>`; } }
    return `<div class="mixrow${k===mixHover?' on':''}" data-k="${esc(k)}"><i class="sw" style="background:${colorOf(c,k)}"></i><span class="n">${esc(k)}</span><span class="amt">${USD.format(v)}</span><span class="p">${Math.round(v/total*100)}%</span><span class="ch">${ch}</span></div>`;
  }).join('');
}
$('mix-period').addEventListener('click',e=>{ const b=e.target.closest('button[data-p]'); if(!b) return; mixPeriod=b.dataset.p; render(); });
function setMixHover(k){ if(k===mixHover) return; mixHover=k;
  $('mix').classList.toggle('hl', !!k);
  for(const el of document.querySelectorAll('#mix i,#mixrows .mixrow')) el.classList.toggle('on', el.dataset.k===k); }
['mix','mixrows'].forEach(id=>{ $(id).addEventListener('mouseover',e=>{ const t=e.target.closest('[data-k]'); setMixHover(t?t.dataset.k:null); }); $(id).addEventListener('mouseleave',()=>setMixHover(null)); });

/* ---------- spending pace: cumulative this month vs last ---------- */
function renderPace(cur, prev){
  const show = tab==='wydatki' && state.wydatki.entries.length;
  $('pace-sec').hidden = !show; if(!show) return;
  const days = (k) => new Date(+k.slice(0,4), +k.slice(5), 0).getDate();
  const cum = (k, upto) => { const d=new Array(days(k)+1).fill(0);
    for(const e of state.wydatki.entries) if(ym(e.date)===k) d[+e.date.slice(8)] += +e.amount||0;
    const out=[0]; for(let i=1;i<=upto;i++) out[i]=out[i-1]+d[i]; return out; };
  const today = new Date().getDate();
  const a = cum(cur, today), b = cum(prev, days(prev));
  const goal = state.wydatki.goal;
  const W=720,H=220,L=4,R=56,T=16,B=26, N=31;
  const max = niceMax(Math.max(a[a.length-1], b[b.length-1], goal||0));
  const x = d => L+(W-L-R)*(d/N), y = v => T+(H-T-B)*(1-v/max);
  const path = arr => arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const curName = MONTHS_FULL[+cur.slice(5)-1], prevName = MONTHS_FULL[+prev.slice(5)-1];
  const PREV = '#b8b8be';
  $('pace-legend').innerHTML = `<span><i class="sw line" style="background:var(--ink)"></i>${curName} (do dziś)</span><span><i class="sw line" style="background:${PREV}"></i>${prevName}</span>`;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Skumulowane wydatki: ${curName} i ${prevName}">`;
  s += `<line class="base" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>`;
  [1,8,15,22,29].forEach(d=>{ s+=`<text x="${x(d)}" y="${H-6}" text-anchor="middle">${d}</text>`; });
  if(goal) s+=`<line class="goal-l" style="stroke:var(--neg)" x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}"/><text style="fill:var(--neg)" x="${L}" y="${y(goal)-6}">budżet ${short(goal)}</text>`;
  s += `<path d="${path(b)}" fill="none" stroke="${PREV}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<path d="${path(a)}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const ea=a.length-1, eb=b.length-1;
  s += `<circle cx="${x(ea)}" cy="${y(a[ea])}" r="4" fill="var(--ink)" stroke="var(--bg)" stroke-width="2"/>`;
  // direct labels: this month beside its last point, last month at its line end
  s += `<text class="lbl-ink" x="${x(ea)+8}" y="${y(a[ea])-8}" font-weight="500">${short(a[ea])}</text>`;
  if(b[eb]>0 && Math.abs(y(b[eb])-(y(a[ea])-8))>12 || ea<eb-6) s += `<text x="${x(eb)+8}" y="${y(b[eb])+4}">${short(b[eb])}</text>`;
  s += `<g id="pace-xh" style="display:none"><line class="xh" y1="${T}" y2="${y(0)}"/><circle r="4" fill="var(--ink)" stroke="var(--bg)" stroke-width="2"/><circle r="4" fill="${PREV}" stroke="var(--bg)" stroke-width="2"/></g>`;
  $('pace').innerHTML = s+'</svg>';
  hovers.pace = ev => {
    const d = Math.round(Math.min(N,Math.max(1,(svgX($('pace').firstChild,ev,W)-L)/(W-L-R)*N)));
    const g = document.getElementById('pace-xh'); g.style.display='';
    const [ln,c1,c2] = g.children; ln.setAttribute('x1',x(d)); ln.setAttribute('x2',x(d));
    const va = d<=ea ? a[d] : null, vb = d<=eb ? b[d] : null;
    c1.style.display = va==null?'none':''; c1.setAttribute('cx',x(d)); c1.setAttribute('cy',y(va||0));
    c2.style.display = vb==null?'none':''; c2.setAttribute('cx',x(d)); c2.setAttribute('cy',y(vb||0));
    showTip(ev, `<div class="h">${d}. dzień miesiąca</div>` + tipRow('var(--ink)',curName, va==null?'—':USD.format(va)) + tipRow(PREV,prevName, vb==null?'—':USD.format(vb)));
  };
  hovers['pace:leave'] = () => { const g=document.getElementById('pace-xh'); if(g) g.style.display='none'; };
}

/* ---------- income vs expenses, last 6 months ---------- */
function renderIO(months){
  const show = state.zarobki.entries.length || state.wydatki.entries.length;
  $('io-sec').hidden = !show; if(!show) return;
  const inc = months.map(m=>monthSum('zarobki',m)), exp = months.map(m=>monthSum('wydatki',m));
  const W=720,H=220,T=30,B=26, EXP='#cfcfd4';
  const max = niceMax(Math.max(...inc,...exp));
  const y = v => T+(H-T-B)*(1-v/max);
  const gw = W/6, bw = Math.min(26, gw*.22);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Przychody i wydatki w ostatnich 6 miesiącach">`;
  s += `<line class="base" x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>`;
  months.forEach((m,i)=>{
    const cx=i*gw+gw/2;
    [[inc[i],'var(--ink)',cx-bw-1],[exp[i],EXP,cx+1]].forEach(([v,col,x])=>{
      if(v>0){ const h=Math.max(4,y(0)-y(v)); s+=`<path d="M${x},${y(0)}v${-(h-4)}a4,4 0 0 1 4,-4h${bw-8}a4,4 0 0 1 4,4v${h-4}z" fill="${col}"/>`; } });
    const net = inc[i]-exp[i];
    if(inc[i]||exp[i]) s+=`<text x="${cx}" y="${y(Math.max(inc[i],exp[i]))-10}" text-anchor="middle" style="fill:${net>=0?'var(--accent)':'var(--neg)'}">${net>=0?'+':'−'}${short(Math.abs(net))}</text>`;
    s+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${MONTHS[+m.slice(5)-1]}</text>`;
  });
  $('io').innerHTML = s+'</svg>';
  hovers.io = ev => {
    const i = Math.min(5,Math.max(0,Math.floor(svgX($('io').firstChild,ev,W)/gw)));
    const net = inc[i]-exp[i];
    showTip(ev, `<div class="h">${monthLabel(months[i])}</div>` + tipRow('var(--ink)','Przychody',USD.format(inc[i])) + tipRow(EXP,'Wydatki',USD.format(exp[i])) +
      `<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><i></i><span>Bilans</span><b class="${net>=0?'good':'bad'}">${net>=0?'+':'−'}${USD.format(Math.abs(net))}</b></div>`);
  };
}

function renderFilter(byMonth){
  const keys=[...byMonth.keys()].sort().reverse();
  if(filter!=='all' && !keys.includes(filter)) filter='all';
  $('filter').hidden = !keys.length;
  $('filter').innerHTML = `<option value="all">Wszystko</option>`+keys.map(k=>`<option value="${k}" ${k===filter?'selected':''}>${monthLabel(k)} · ${USD0.format(byMonth.get(k))}</option>`).join('');
}

function renderList(){
  const {entries}=S();
  if(!entries.length){
    $('list').innerHTML = `<div class="empty">Brak wpisów.<button class="link" id="demo" type="button">Wczytaj przykładowe dane</button></div>`;
    $('demo').onclick = loadDemo; return;
  }
  const list = entries.filter(e=>filter==='all'||ym(e.date)===filter)
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
  $('list').innerHTML = '<ul class="rows">'+list.map(e=>{
    const [Y,M,D]=e.date.split('-');
    if(pendingDelete===e.id) return `<li><span class="d">${D}.${M}.${Y.slice(2)}</span><div class="confirm">Usunąć ${esc(e.source)} · ${USD.format(e.amount)}?<button data-yes="${e.id}">Usuń</button><button class="no" data-no>Anuluj</button></div></li>`;
    return `<li><span class="d">${D}.${M}.${Y.slice(2)}</span>
      <div class="t"><div class="s">${esc(e.source)}</div><div class="k">${esc(e.kind)}${e.note?' · '+esc(e.note):''}</div></div>
      <span class="a">${tab==='wydatki'?'−':''}${USD.format(e.amount)}</span>
      <button class="del" data-del="${e.id}" aria-label="Usuń wpis">×</button></li>`;
  }).join('')+'</ul>';
}

/* ---------- actions ---------- */
$('list').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.dataset.del){ pendingDelete=b.dataset.del; renderList(); }
  else if(b.dataset.yes){ S().entries=S().entries.filter(e=>e.id!==b.dataset.yes); pendingDelete=null; save(); render(); toast('Usunięto wpis'); }
  else if('no' in b.dataset){ pendingDelete=null; renderList(); }
});
$('filter').addEventListener('change',e=>{ filter=e.target.value; renderList(); });

$('form').addEventListener('submit',ev=>{
  ev.preventDefault();
  const amount = Math.round(parseFloat($('f-amount').value.replace(',','.'))*100)/100;
  if(!(amount>0)){ toast('Wpisz kwotę większą od zera'); return; }
  S().entries.push({ id:newId(), amount, date:$('f-date').value, source:$('f-source').value.trim(), kind:$('f-kind').value, note:$('f-note').value.trim(), createdAt:Date.now() });
  save(); render();
  toast('Dodano '+USD.format(amount));
  $('f-amount').value=''; $('f-source').value=''; $('f-note').value=''; $('f-amount').focus();
});

let goalT;
$('goal').addEventListener('input',e=>{ clearTimeout(goalT); const t=tab; goalT=setTimeout(()=>{ const g=Math.max(0,+e.target.value||0); if(g===state[t].goal) return; state[t].goal=g; save(t); if(t===tab) render(); },500); });

function loadDemo(){
  lastMonths(6).forEach((m,i)=>cfg().demo(m,i).forEach(d=>S().entries.push({...d,id:newId(),note:'',createdAt:Date.now()})));
  save(); render(); toast('Wczytano przykładowe dane');
}

/* ---------- export / import ---------- */
function download(name, text, type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('export-csv').onclick=()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Typ','Data','Kwota (USD)','Opis','Kategoria','Notatka']];
  for(const k in TABS) for(const e of [...state[k].entries].sort((a,b)=>a.date.localeCompare(b.date)))
    rows.push([k==='wydatki'?'Wydatek':'Wpływ',e.date,k==='wydatki'?-e.amount:e.amount,e.source,e.kind,e.note]);
  download('finanse-'+todayStr()+'.csv','﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8');
};
$('export-json').onclick=()=>download('finanse-kopia-'+todayStr()+'.json',JSON.stringify({version:2,...state},null,2),'application/json');
$('import-btn').onclick=()=>$('import-file').click();
$('import-file').onchange=async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{
    const o=JSON.parse(await f.text());
    // v1 backups (earnings only) have {entries, goal} at the top level
    const parts = Array.isArray(o.entries) ? {zarobki:o} : o;
    let n=0, any=false;
    for(const k in TABS){
      const p=parts[k]; if(!p||!Array.isArray(p.entries)) continue; any=true;
      const have=new Set(state[k].entries.map(e=>e.id));
      const add=p.entries.filter(e=>e&&e.date&&+e.amount>0&&!have.has(e.id));
      state[k].entries=state[k].entries.concat(add); n+=add.length;
      if(p.goal&&!state[k].goal) state[k].goal=+p.goal||0;
      save(k);
    }
    if(!any) throw 0;
    setTab(tab,true); toast('Przywrócono '+n+' wpisów');
  }catch(e){ toast('To nie jest plik kopii zapasowej z tej strony'); }
};

/* ---------- init ---------- */
$('f-date').value = todayStr();
load();
try{ localStorage.setItem('finanse.test','1'); localStorage.removeItem('finanse.test'); }catch(e){ $('warn').hidden=false; }
setTab(location.hash.slice(1), true);
window.addEventListener('hashchange',()=>setTab(location.hash.slice(1),true));
</script>
